  <style>
    body {
      background-color: #0F1122;

      font-family: 'Inter', sans-serif;

    .glass {
      background: rgba(255,255,255,0.05);

    h1, h2 {

      -webkit-text-fill-color: transparent;
    }
    a.btn {
      background: linear-gradient(135deg, #9d4edd, #5f0cff);
      padding: 12px 22px;
      border-radius: 10px;
      color: white;
      font-weight: 600;
      transition: all 0.3s ease;

    <div class="text-center mt-10">
      <a href="/" class="btn lang" data-en="Back to Homepage" data-de="Zurück zur Startseite"></a>

  </div>

  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({ once: true, offset: 80 });

    // 🟣 Sprache aus LocalStorage übernehmen
    document.addEventListener("DOMContentLoaded", () => {
      const lang = localStorage.getItem("kabutoLang") || "en";
      document.querySelectorAll(".lang").forEach(el => {
        const text = el.getAttribute(`data-${lang}`);
        if (text) el.innerHTML = text;
      });
      document.documentElement.lang = lang;
    });
  </script>
</body>
</html>
