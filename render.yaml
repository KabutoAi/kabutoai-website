services:
  - type: web
    name: kabutoai-website
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m kabuto_ai.bot
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_API_TOKEN
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
